<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>咨询师傅联系方式</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <div class="page__shell">
      <header class="hero">
        <h1 class="hero__title">联系师傅【谭猫殿】</h1>
      </header>

      <section class="ticket ticket--top-spacer" aria-hidden="true">
        <div class="ticket__border"></div>
      </section>

      <section class="ticket" aria-labelledby="order-title">
        <div class="ticket__body product-card">
          <img class="product-card__image" src="./assets/product.jpg" alt="商品缩略图">
          <div class="product-card__content">
            <h2 class="product-card__title" id="order-title">联系师傅，请仔细阅读下文</h2>
            <div class="product-card__meta">
              <span></span>
              <span>X1</span>
            </div>
          </div>
        </div>
        <div class="ticket__perforation"></div>
        <div class="ticket__body article">
          <p>缘主，您好：</p>
          <p>
            为了能及时的为您服务，我们采用了更高效联系师父的方法提升您的效率，
            <mark>截图后用V扫描下方</mark>
            名片，添加师父，谢谢您的配合
          </p>
          <div class="article__qr-wrap">
            <img class="article__qr" src="./assets/qr.png" alt="联系客服二维码">
          </div>
          <p></p>
        </div>
      </section>

      <section class="note" aria-labelledby="notice-title">
        <div class="note__heading-row">
          <div class="note__heading-wrap">
            <h2 class="note__title" id="notice-title">温馨提示</h2>
            <span class="note__accent"></span>
          </div>
          <span class="note__line"></span>
        </div>
        <p class="note__text">• 以上所展示的信息均由商家自行设定并独立承担全部责任，如有侵权行为请联系商家或购买平台进行处理。</p>
      </section>

      <section class="ticket ticket--bottom-spacer" aria-hidden="true">
        <div class="ticket__border ticket__border--bottom"></div>
      </section>

      <footer class="footer">
        <p>- 谭猫殿提供技术支持 -</p>
        <p>Copyright © 2018 - 2026 All rights reserved.</p>
      </footer>
    </div>
  </main>
</body>
</html>
